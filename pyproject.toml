[project]
name = "buds-watcher"
version = "0.1.0"
description = "Sony INZONE Buds 左右切断検知アプリ"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "hid>=1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100  # 日本語コメントが多く、既定の88だと頻繁に引っかかるため

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle, pyflakes, isort
