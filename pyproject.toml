[project]
name = "buds-watcher"
version = "0.0.2"
description = "Sony INZONE Buds 左右切断検知アプリ"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "hidapi>=0.14",
]

[tool.uv]
package = false

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "poethepoet>=0.48.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100  # 日本語コメントが多く、既定の88だと頻繁に引っかかるため

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle, pyflakes, isort

# `uv run poe <task>` で実行する(npmのpackage.json scriptsに相当)
[tool.poe.tasks]
app = "python3 src/main.py"
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
check = ["lint", "format-check"]
build = "pyinstaller --onefile --windowed --name buds-watcher --collect-all hid --exclude-module PySide6.QtNetwork src/main.py"
