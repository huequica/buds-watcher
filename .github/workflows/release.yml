name: Build Windows exe and release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # タグ名はpyproject.tomlの [project] version をそのまま使う("v"を付与)。
      # リリースするバージョンは、masterへのPRを作る際にpyproject.tomlで上げておくこと。
      - name: Read version from pyproject.toml
        id: version
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - run: uv sync --no-default-groups --group build

      - run: uv run poe build

      - uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          body: |
            > [!WARNING]
            > exe に関しては署名していないので初回起動時に Windows Defender SmartScreen の警告が出る場合があります
          files: dist/buds-watcher.exe
