name: On-demand PR build

# メンテナがPRに `!build` とコメントすると、そのPRのHEAD時点のコードをビルドし、
# ワークフローのArtifactとしてアップロードしてコメントで知らせる(リリースは作らない)。
#
# 注意: author_association でゲートしているが、信頼できないPRの内容を
# そのままビルド(コード実行)するため、内容を確認していないPRに対して
# `!build` を実行しないこと。
on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write

jobs:
  build:
    if: >
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '!build') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: windows-latest
    steps:
      - name: Comment build started
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `ビルド開始しました: ${runUrl}`,
            });

      - name: Resolve PR head commit
        id: pr
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('sha', pr.head.sha);

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - run: uv sync --no-default-groups --group build

      - run: uv run poe build

      - uses: actions/upload-artifact@v7
        with:
          name: buds-watcher-pr${{ github.event.issue.number }}-${{ steps.pr.outputs.sha }}
          path: dist/buds-watcher.exe
          retention-days: 14

      - name: Comment result on PR
        if: always()
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = success
              ? `ビルドできました。Artifactからダウンロードしてください(14日で失効): ${runUrl}`
              : `ビルドに失敗しました: ${runUrl}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
